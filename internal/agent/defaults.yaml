claude:
  description: "Claude Code (Anthropic)"
  dependencies:
    - mise-node
  path_entries:
    - "$HOME/.claude/local/bin"
  mounts:
    - location: "{{ .state_dir }}/.claude/projects"
      mountPoint: "{{ .home }}/.claude/projects"
      mode: rw
    - location: "{{ .state_dir }}/.claude/image-cache"
      mountPoint: "{{ .home }}/.claude/image-cache"
      mode: rw
  cli_command: claude
  launch_args: --dangerously-skip-permissions
  setup: |
    curl -fsSL https://claude.ai/install.sh | bash

copilot:
  description: "GitHub Copilot CLI (copilot cli)"
  mounts:
    - location: "{{ .state_dir }}/.copilot/session-state"
      mountPoint: "{{ .home }}/.copilot/session-state"
      mode: rw
  cli_command: copilot
  launch_args: --yolo
  setup: |
    curl -fsSL https://gh.io/copilot-install | bash

cursor:
  description: "Cursor Agent CLI"
  dependencies:
    - system
  path_entries:
    - "$HOME/.local/bin"
  mounts:
    - location: "{{ .state_dir }}/.cursor"
      mountPoint: "{{ .home }}/.cursor"
      mode: rw
  cli_command: agent
  launch_args: --yolo
  setup: |
    curl https://cursor.com/install -fsS | bash

opencode:
  description: "OpenCode CLI"
  dependencies:
    - system
  path_entries:
    - "$HOME/.opencode/bin"
  cli_command: opencode
  setup: |
    set -euo pipefail
    curl -fsSL https://opencode.ai/install | bash
    opencode --version >/dev/null
    config_file="$HOME/.config/opencode/opencode.json"
    mkdir -p "$(dirname "$config_file")"
    echo '{}' | jq '
      .permission.bash."*" = "allow" |
      .permission.edit."*" = "allow" |
      .permission.read."*" = "allow"
    ' > "$config_file"
