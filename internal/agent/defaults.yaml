claude:
  description: "Claude Code (Anthropic)"
  dependencies:
    - mise-claude
  mounts:
    - source: "{{ .state_dir }}/.claude/projects"
      target: "~/.claude/projects"
      mode: rw
    - source: "{{ .state_dir }}/.claude/image-cache"
      target: "~/.claude/image-cache"
      mode: rw
  cli_command: claude
  launch_args: --dangerously-skip-permissions

copilot:
  description: "GitHub Copilot CLI (copilot cli)"
  dependencies:
    - mise-copilot
  mounts:
    - source: "{{ .state_dir }}/.copilot/session-state"
      target: "~/.copilot/session-state"
      mode: rw
  cli_command: copilot
  launch_args: --yolo

cursor:
  description: "Cursor Agent CLI"
  dependencies:
    - system
  path_entries:
    - "$HOME/.local/bin"
  mounts:
    - source: "{{ .state_dir }}/.cursor"
      target: "~/.cursor"
      mode: rw
  cli_command: agent
  launch_args: --yolo
  setup: |
    curl https://cursor.com/install -fsS | bash

opencode:
  description: "OpenCode CLI"
  dependencies:
    - mise-opencode
  cli_command: opencode
  setup: |
    config_file="$HOME/.config/opencode/opencode.json"
    mkdir -p "$(dirname "$config_file")"
    echo '{}' | jq '
      .permission.bash."*" = "allow" |
      .permission.edit."*" = "allow" |
      .permission.read."*" = "allow"
    ' > "$config_file"
